# rust-link: Audio Node tương thích Lavalink v4
# Mọi khóa đều tùy chọn; giá trị bên dưới là mặc định khuyến nghị.
# File application.yml của Lavalink v4 cũng dùng được: các khóa lavalink.server.* (password,
# sources, playerUpdateInterval...) được đọc khi khóa tương ứng của rust-link vắng mặt.
# Biến môi trường ghi đè: RUSTLINK_SERVER_PASSWORD (hoặc LAVALINK_SERVER_PASSWORD),
# RUSTLINK_SERVER_PORT, RUSTLINK_SERVER_ADDRESS, RUSTLINK_CACHE_DIR.

server:
  address: 0.0.0.0
  port: 2333
  # Giá trị header "Authorization" mà client Lavalink phải gửi
  password: "youshallnotpass"

lavalink:
  playerUpdateInterval: 5        # giây giữa các op "playerUpdate"
  statsInterval: 60              # giây giữa các op "stats"
  trackStuckThresholdMs: 10000   # không có frame trong khoảng này -> TrackStuckEvent
  resumeBacklogSize: 1000        # số event giữ lại khi session đang chờ resume
  # Filter client được phép dùng (Lavalink: lavalink.server.filters).
  # Filter tắt ở đây sẽ bị từ chối với lỗi 400 khi client gửi lên.
  filters:
    volume: true
    equalizer: true
    karaoke: true
    timescale: true
    tremolo: true
    vibrato: true
    distortion: true
    rotation: true
    channelMix: true
    lowPass: true

audio:
  opusBitrate: 128000
  opusComplexity: 10
  frameBufferMs: 400             # bộ đệm frame 20ms giữa decoder và UDP sender
  opusPassthrough: true          # gửi thẳng gói Opus 48kHz stereo khi volume = 100 và không bật filter nào
  encryptionMode: auto           # auto | aead_aes256_gcm_rtpsize | aead_xchacha20_poly1305_rtpsize
  dave: true                     # hỗ trợ Discord E2EE (DAVE); cần client gửi voice.channelId
  udpKeepaliveSecs: 5

sources:
  youtube: true
  soundcloud: true
  http: true                     # URL trực tiếp tới file audio / radio stream
  ytdlpGeneric: true             # các URL khác: thử qua extractor của yt-dlp
  httpTimeoutSecs: 20
  ytdlp:
    # managed: rust-link tự tải yt-dlp chính thức vào managedDir và tự cập nhật.
    # Muốn dùng yt-dlp đã cài sẵn thì ghi đường dẫn, ví dụ: path: yt-dlp
    path: managed
    managedDir: ./bin
    autoUpdate: true             # YouTube đổi liên tục, yt-dlp cũ là hỏng phát nhạc
    updateIntervalHours: 24
    format: "bestaudio[acodec=opus]/bestaudio/best"
    searchLimit: 10
    metadataTimeoutSecs: 30
    extraArgs: []                # ví dụ: ["--cookies", "/config/cookies.txt"]

cache:
  enabled: true
  directory: /data/cache         # file lưu tại {directory}/{id_prefix}/{video_id}.opus
  database: /data/cache/index.db
  maxSize: 20GiB
  highWatermark: 0.90            # vượt 90% maxSize -> bắt đầu dọn LRU
  lowWatermark: 0.80             # dọn tới khi còn dưới 80%
  lruIntervalSecs: 60
  evictUnsynced: false           # false: không xóa file chưa backup lên OneDrive
  progressivePlayback: true      # phát ngay trong lúc file còn đang tải
  maxFileSize: 1GiB              # file lớn hơn (khi biết trước kích thước) sẽ phát thẳng, không lưu cache
  maxTrackDurationSecs: 7200     # bài dài hơn 2 giờ phát thẳng từ nguồn (vẫn tua được); 0 = không giới hạn
  fileExtension: opus

onedrive:
  enabled: false
  # Tạo file này bằng lệnh: rust-link onedrive-login --client-id <APP_ID>
  credentialsFile: config/onedrive.json
  remoteFolder: AudioCache       # /me/drive/root:/AudioCache/{filename}
  syncIntervalSecs: 300
  syncBatchSize: 25
  maxConcurrentUploads: 2
  chunkSize: 10MiB               # được làm tròn xuống bội số của 320 KiB
  simpleUploadMax: 4MiB          # file nhỏ hơn: PUT một lần, không cần upload session
  snapshotIntervalSecs: 3600     # chu kỳ backup snapshot SQLite
  restoreIndexOnStartup: true    # mất DB cục bộ -> tải snapshot từ OneDrive về
  maxSyncAttempts: 12
  requestTimeoutSecs: 120

logging:
  level: info                    # hoặc dạng Lavalink: { root: INFO, lavalink: INFO }; RUST_LOG được ưu tiên hơn
  file:
    path: ./logs/                # ghi thêm log ra file xoay vòng theo ngày, giống Lavalink; bỏ dòng này để tắt
