[package]
name = "rust-link"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lavalink v4 compatible audio node with local LRU audio cache and OneDrive backup"
license = "MIT"

[lib]
name = "rust_link"
path = "src/lib.rs"

[[bin]]
name = "rust-link"
path = "src/main.rs"

[features]
default = ["dave"]
dave = ["dep:davey"]

[dependencies]
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
symphonia = { version = "0.5.5", features = ["all"] }
rubato = "0.16"
audiopus = "0.3.0-rc.0"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
davey = { version = "0.2", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "multipart", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
bytes = "1"
dashmap = "6"
url = "2"
percent-encoding = "2"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
