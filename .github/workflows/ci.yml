name: CI

# Lint, test and MSRV check on every push and pull request. The README build badge reads
# this workflow. Lints run on a pinned toolchain so a new Clippy release cannot break CI on
# its own: bump LINT_TOOLCHAIN deliberately and fix the new lints in the same change.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINT_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (pinned toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install "${LINT_TOOLCHAIN}" --profile minimal -c clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo "+${LINT_TOOLCHAIN}" fmt --all -- --check
      - name: Clippy
        run: cargo "+${LINT_TOOLCHAIN}" clippy --all-targets --locked -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=${msrv}" >> "${GITHUB_OUTPUT}"
          rustup toolchain install "${msrv}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo "+${{ steps.msrv.outputs.version }}" check --all-targets --locked
